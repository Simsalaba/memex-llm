[project]
name = "memex-llm"
version = "0.1.0"
description = "Personal knowledge base powered by local LLMs — distills conversations and documents into an Obsidian vault"

[project.urls]
Homepage = "https://github.com/Simsalaba/memex-llm"
Repository = "https://github.com/Simsalaba/memex-llm.git"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "python-slugify>=8.0",
    "rapidfuzz>=3.0",
]

[project.scripts]
wiki = "pipeline.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
